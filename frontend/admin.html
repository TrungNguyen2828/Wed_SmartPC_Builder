<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SmartPC Builder</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="dashboard-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>SmartPC Admin</h2>
            </div>
            <ul class="sidebar-menu">
                <!-- Tách làm 3 menu riêng biệt -->
                <li class="menu-item active" data-target="inventory-section">
                    📦 Product Inventory
                </li>
                <li class="menu-item" data-target="add-product-section">
                    ➕ Add/Update Product
                </li>
                <li class="menu-item" data-target="orders-section">
                    🛒 Orders Management
                </li>
            </ul>
            <div class="sidebar-footer">
                <a href="home.html" class="back-link">← Go to Store</a>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            
            <!-- ========================================== -->
            <!-- SECTION 1: PRODUCT INVENTORY (Active by default) -->
            <!-- ========================================== -->
            <section id="inventory-section" class="content-section active-section">
                <div class="admin-wrapper">
                    <div class="table-container">
                        <h2>Product Inventory</h2>
                        <table class="product-table">
                            <thead>
                                <tr>
                                    <th>Image</th>
                                    <th>Name</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="productListBody">
                                <!-- Data injected by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- ========================================== -->
            <!-- SECTION 2: ADD / UPDATE PRODUCT -->
            <!-- ========================================== -->
            <section id="add-product-section" class="content-section">
                <div class="admin-wrapper">
                    <div class="admin-container">
                        <h2>Add/Update Product</h2>
                        <form id="addProductForm">
                            <div class="form-group">
                                <label for="add-name">Product Name</label>
                                <input type="text" id="add-name" placeholder="e.g., Intel Core i9-13900K" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="add-category">Category</label>
                                <input type="text" id="add-category" placeholder="e.g., CPU, RAM, VGA" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="add-price">Price ($)</label>
                                <input type="number" id="add-price" placeholder="e.g., 550" required>
                            </div>
                            
                            <div class="form-group">
                                <label>Product Image</label>
                                <input type="url" id="add-image-url" placeholder="Paste Image URL here (e.g., https://...)">
                                <div class="or-divider">— OR —</div>
                                <input type="file" id="add-image-file" accept="image/*" class="file-input">
                            </div>
                            
                            <div class="form-group">
                                <label for="add-description">Description</label>
                                <textarea id="add-description" placeholder="Enter product description here..." rows="3" required></textarea>
                            </div>

                            <button type="submit" class="btn-submit">Save Product</button>
                        </form>
                    </div>
                </div>
            </section>

            <!-- ========================================== -->
            <!-- SECTION 3: ORDERS MANAGEMENT -->
            <!-- ========================================== -->
            <section id="orders-section" class="content-section">
                <div class="admin-wrapper">
                    <div class="table-container">
                        <h2>Order List</h2>
                        <table class="product-table">
                            <thead>
                                <tr>
                                    <th>Order ID</th>
                                    <th>Customer</th>
                                    <th>Total Price</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="orderListBody">
                                <tr>
                                    <td colspan="5" class="empty-message">No orders yet or still loading...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
