<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - SmartPC Builder</title>
    <link rel="stylesheet" href="../css/profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Navigation (Back to Home) -->
    <header class="profile-header">
        <div class="header-container">
            <a href="home.html" class="logo">SmartPC Builder</a>
            <a href="home.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Store</a>
        </div>
    </header>

    <div class="profile-page-wrapper">
        
        <!-- Left Column: User Details (Your original code, wrapped in a card) -->
        <div class="profile-container">
            <h2>Account Details</h2>
            <form id="profileForm">
                
                <div class="form-group">
                    <label>Email Address (Cannot be changed):</label>
                    <input type="email" id="email" readonly>
                </div>

                <div class="form-group">
                    <label>Full Name:</label>
                    <input type="text" id="username" placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label>Phone Number:</label>
                    <input type="tel" id="phone" placeholder="Enter your phone number">
                </div>

                <div class="form-group">
                    <label>Address:</label>
                    <textarea id="address" placeholder="Enter your address"></textarea>
                </div>

                <button type="submit" class="btn-save">Save Changes</button>
            </form>
        </div>

        <!-- Right Column: Order History -->
        <div class="orders-container">
            <h2>My Order History</h2>
            <div class="table-responsive">
                <table class="order-table">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Date</th>
                            <th>Total</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="userOrdersBody">
                        <!-- Orders will be injected here by JS -->
                        <tr><td colspan="4" style="text-align: center; padding: 20px;">Loading your orders...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="js/profile.js"></script>
</body>
</html>
